<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Layout idea: the board is the interface. A slim toolbar picks the mode (Collect, Cluster,
   Connect, Story); the 3x3 matrix fills the page. Columns thin out (solid, dotted, hatched)
   as certainty falls toward H3. Cards stack like folders; threads run underneath the stacks. */
:root{
  --bg:#f2f3f0;
  --surface:#ffffff;
  --ink:#16222e;
  --muted:#5a6672;
  --line:#d4d9d8;
  --accent:#1d4466;
  --accent-soft:#e3ebf2;
  --hl:#c8470f;
  --good:#2f7a4f;
  --warn:#9a6a00;
  --t1:#c8470f; --t2:#0b7a75; --t3:#6d45ad; --t4:#a87d00; --t5:#b5245c; --t6:#2b67a8;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --read:"Newsreader", Georgia, "Times New Roman", serif;
  --r:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#16202a; --ink:#e4eaef; --muted:#97a4b0; --line:#2a3642;
    --accent:#8db4dc; --accent-soft:#1c2c3c; --hl:#ff7c48; --good:#5fbf86; --warn:#e0b44a;
    --t1:#ff7c48; --t2:#3cc4bc; --t3:#a888e6; --t4:#e2bb3d; --t5:#f0679b; --t6:#6aa6e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --ink:#e4eaef; --muted:#97a4b0; --line:#2a3642;
  --accent:#8db4dc; --accent-soft:#1c2c3c; --hl:#ff7c48; --good:#5fbf86; --warn:#e0b44a;
  --t1:#ff7c48; --t2:#3cc4bc; --t3:#a888e6; --t4:#e2bb3d; --t5:#f0679b; --t6:#6aa6e8;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}

/* Toolbar */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1480px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mark{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.board-pick{display:flex;gap:6px;align-items:center;min-width:0;flex:0 1 300px}
.board-pick select{min-width:0;flex:1}
.modes{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.modes a{display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:5px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.modes a .n{font-family:var(--mono);font-size:10.5px}
.modes a:hover{color:var(--ink)}
.modes a[aria-current="page"]{background:var(--accent);color:var(--surface)}
.spacer{flex:1}
.status{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.status.warn{color:var(--warn)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .mlist{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;display:grid;min-width:190px;z-index:40;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 14%,transparent)}
details.menu .mlist button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:14px}
details.menu .mlist button:hover{background:var(--accent-soft)}
.hint{max-width:1480px;margin:0 auto;padding:7px 16px 9px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.hint .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.claude{border-color:var(--hl);color:var(--hl)}
.btn.claude:hover{background:color-mix(in srgb,var(--hl) 8%,var(--surface))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--hl)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.icon{padding:5px 8px}
input[type=text],input[type=password],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
select{width:auto;padding:5px 8px}
textarea{resize:vertical;min-height:60px}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.help{color:var(--muted);font-size:13px;margin:2px 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

main{max-width:1480px;margin:0 auto;padding:14px 16px 80px}
.bp-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.bp-head h1{font-size:clamp(22px,2.6vw,32px);font-stretch:115%;font-weight:750;letter-spacing:-.01em}
.bp-head p{margin:4px 0 0;color:var(--muted);max-width:70ch;font-size:14.5px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hl)}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-stretch:120%;font-size:20px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.notice{border-left:3px solid var(--hl);background:var(--surface);padding:8px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:13.5px}

/* Board */
.board-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px 8px}
.board{position:relative;min-width:980px;display:grid;grid-template-columns:104px repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.board .colh{padding:10px 14px 8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.board .colh .k{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:22px;line-height:1;color:var(--accent)}
.board .colh .l{font-weight:600;font-size:13px;margin-top:3px}
.board .colh .p{font-family:var(--mono);font-size:11px;color:var(--muted)}
.board .corner{border-bottom:1px solid var(--line);padding:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;align-items:flex-end}
.board .rowh{padding:12px 10px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;line-height:1.25;display:flex;flex-direction:column;gap:3px}
.board .rowh .ix{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400}
.board .last{border-bottom:0}
.mc{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 12px 12px;min-height:170px;display:flex;flex-direction:column;gap:10px;transition:background-color .15s}
.mc.H2{background-image:radial-gradient(color-mix(in srgb,var(--muted) 22%,transparent) 1px,transparent 1.2px);background-size:9px 9px}
.mc.H3{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 13%,transparent) 0 1px,transparent 1px 8px)}
.mc.drop-on{background-color:color-mix(in srgb,var(--hl) 9%,transparent);box-shadow:inset 0 0 0 2px var(--hl)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px 12px;align-content:start}
svg.threads{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
svg.threads .hit{pointer-events:stroke;cursor:pointer}
body.dragging svg.threads .hit{pointer-events:none}

.tile{position:relative;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;line-height:1.3;cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .2s,transform .12s,box-shadow .12s;text-align:left}
.tile:hover{border-color:var(--muted)}
.dragmode .tile{touch-action:none}
.card{border-left:3px solid var(--accent-soft)}
.card.source{border-left-color:var(--good)}
.card .ref{display:block;font-family:var(--mono);font-size:10px;color:var(--good);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .k{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--good)}
.stack{background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line));margin:0 7px 7px 0;
  box-shadow:3px 3px 0 -1px var(--surface),3px 3px 0 0 color-mix(in srgb,var(--accent) 35%,var(--line)),7px 7px 0 -1px var(--surface),7px 7px 0 0 color-mix(in srgb,var(--accent) 25%,var(--line))}
.stack .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.stack .pv{display:grid;gap:1px;margin:4px 0 5px;font-size:11.5px;color:var(--muted)}
.stack .pv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack .mt{display:flex;gap:6px;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dot{width:15px;height:15px;border-radius:50%;background:var(--tc);color:var(--surface);font-size:9px;display:grid;place-items:center;font-weight:500;font-family:var(--mono)}
.tile.dim{opacity:.3}
.tile.muted{opacity:.55}
.tile.drop-on{box-shadow:0 0 0 3px var(--hl);transform:scale(1.04)}
.tile.lifting{opacity:.25}
.handle{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--hl);border:3px solid var(--surface);cursor:crosshair;touch-action:none;z-index:3;box-shadow:0 0 0 1px var(--hl)}
.handle:hover{transform:scale(1.15)}
.dragghost{position:fixed;z-index:100;pointer-events:none;margin:0;transform:rotate(-2.5deg) scale(1.05);box-shadow:0 14px 30px color-mix(in srgb,var(--ink) 25%,transparent) !important;opacity:.95}
svg.live{position:fixed;inset:0;z-index:90;pointer-events:none;width:100vw;height:100vh}

.addbtn{align-self:flex-start;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;margin-top:auto}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.cell-empty{font-family:var(--mono);font-size:11px;color:var(--muted);margin:auto 0}
.composer{position:relative;z-index:2;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px;display:grid;gap:6px;box-shadow:0 0 0 3px var(--accent-soft)}
.kt{display:flex;gap:4px}
.kt button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 6px;font-size:12px;cursor:pointer}
.kt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.composer input,.composer textarea{font-size:13.5px;padding:6px 8px}
.composer textarea{min-height:44px}
.cbar{display:flex;gap:6px;align-items:center}
.cbar .more{margin-right:auto}

/* Thread bar */
.tbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;align-items:center}
.lg{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-size:13px;font-weight:500}
.lg.on{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.lg.off{opacity:.45}
.badge{flex:none;width:22px;height:22px;border-radius:50%;background:var(--tc);color:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:500}
.tedit{width:100%;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:var(--r);padding:12px;display:grid;gap:10px;margin-top:4px}
.tedit .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tedit .row input{flex:1;min-width:200px;font-weight:600}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seq .step{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 3px 3px 8px;font-size:13px;background:var(--bg)}
.seq .step .c{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.seq .ar{color:var(--tc);font-weight:700}
.seq .step button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:12px}
.seq .step button:hover{color:var(--ink);background:var(--line)}

/* Story */
.narr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;margin-top:30px;align-items:start}
@media (max-width:900px){.narr{grid-template-columns:1fr}}
.narr h2{font-size:22px;font-stretch:112%}
.prose{font-family:var(--read);font-size:18px;line-height:1.55;max-width:65ch}
.editable{border-radius:4px;padding:2px 4px;margin:0 -4px;white-space:pre-wrap;outline:none}
.editable:hover{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.editable:focus{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.editable:empty::before{content:attr(data-placeholder);color:var(--muted);font-style:italic}
.thread-narr{border-left:4px solid var(--tc);padding:2px 0 2px 16px;margin:22px 0}
.thread-narr h3{font-size:17px;font-stretch:110%;display:flex;gap:8px;align-items:center}
.path{display:flex;flex-wrap:wrap;gap:4px 6px;margin:6px 0 8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);align-items:center}
.path .pn{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}
.path .ar{color:var(--tc)}
.ev{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ev.thin{color:var(--warn)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
aside.side{display:grid;gap:18px}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-box h3{font-size:15px;font-stretch:110%;margin-bottom:8px}
.insights{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:ins}
.insights li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;font-size:14.5px;counter-increment:ins}
.insights li::before{content:counter(ins);font-family:var(--mono);font-size:11px;color:var(--hl);padding-top:3px}
.gaps{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13.5px}
.gaps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.sev{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:2px 5px;height:fit-content}
.sev.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.sev.i{background:var(--accent-soft);color:var(--accent)}
.sev.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}

/* Layers */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 38%,transparent);z-index:50;display:grid;place-items:center;padding:16px}
.folder-ov{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:color-mix(in srgb,var(--bg) 55%,transparent)}
.folder{background:color-mix(in srgb,var(--surface) 92%,var(--accent-soft));border:1px solid var(--line);border-radius:20px;width:min(620px,100%);max-height:86vh;overflow:auto;padding:22px;display:grid;gap:12px;box-shadow:0 30px 60px color-mix(in srgb,var(--ink) 22%,transparent)}
.folder .fcell{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.folder input.fname{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:24px;text-align:center;border:0;background:transparent;box-shadow:none;padding:2px}
.folder input.fname:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft)}
.folder input.fsum{text-align:center;border:0;background:transparent;color:var(--muted);font-size:14px}
.folder input.fsum:focus{background:var(--surface);color:var(--ink)}
.folder .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.folder .tiles .tile{touch-action:none}
.fbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dialog{background:var(--surface);border-radius:12px;border:1px solid var(--line);max-width:560px;width:100%;max-height:88vh;overflow:auto;display:grid;gap:12px;padding:18px}
.dialog h3{font-size:17px}
.dialog .bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dialog .bar .left{margin-right:auto}
.dialog textarea.code{min-height:300px;font-family:var(--mono);font-size:12px}
.drawer-ov{place-items:stretch end;padding:0}
.drawer{background:var(--surface);width:min(440px,100%);height:100%;overflow:auto;padding:20px;display:grid;gap:14px;align-content:start;border-left:1px solid var(--line)}
.drawer h3{font-size:18px;font-stretch:110%}
.drawer .grp{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.drawer .two{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr);gap:6px;align-items:center}
.drawer .two b{font-family:var(--display);font-stretch:125%;color:var(--accent)}
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:10px;padding:12px;width:280px;display:grid;gap:8px;box-shadow:0 12px 30px color-mix(in srgb,var(--ink) 20%,transparent)}
.pop .bar{display:flex;justify-content:flex-end;gap:6px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 10px 9px 14px;border-radius:8px;font-size:14px;z-index:80;max-width:min(560px,calc(100% - 32px));display:flex;gap:12px;align-items:center}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:13px}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.tile,.mc{transition:none}}
@media (max-width:640px){.modes a{padding:5px 8px}.modes a .n{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v20M14 1v20M1 8h20M1 14h20" stroke="currentColor" stroke-width="1" opacity=".5"/><path d="M4.5 17.5 C 9 17, 9 11, 11 11 S 15 5, 17.5 4.5" fill="none" stroke="var(--hl)" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Horizon Blueprint</span>
    </div>
    <div class="board-pick">
      <select id="boardSel" aria-label="Choose a board"></select>
    </div>
    <nav class="modes" id="modes" aria-label="Board mode">
      <a href="#collect" data-v="collect"><span class="n">1</span>Collect</a>
      <a href="#cluster" data-v="cluster"><span class="n">2</span>Cluster</a>

<script>
(function(){

const clone=o=>JSON.parse(JSON.stringify(o));

      overview:"Northline's strongest signals today sit in the customer layer: hybrid working has broken the commuter fare model, and rural off-peak services are losing riders because they are hard to rely on. Both problems point to the same longer-term move, from a fixed timetable sold as tickets to a service people reach through an account and book when they need it.\n\nThe binding constraint is people rather than technology. Driver vacancies and split shifts limit what can be piloted in the next cycle, so the workforce thread has to start now for the other two to land.",

/* ---------- State ---------- */
let board=exampleBoard();
let boards=[];
const ui={mode:"collect",sel:null,folder:null,naming:false,edit:null,settings:false,pop:null,compose:null,busy:null,confirmDel:false,dialog:null};
const caps={db:null,user:null,sample:null,downloads:null,uid:null};
let hist=[];

const hz=c=>board.horizons[c];
const ly=r=>board.layers[r];
const cellName=(c,r)=>`${c} · ${ly(r).label}`;
const short=r=>ly(r).label.split("/")[0].trim();
const itemById=id=>board.items.find(i=>i.id===id);
const themeById=id=>board.themes.find(t=>t.id===id);
const themeOfItem=id=>board.themes.find(t=>t.itemIds.includes(id));
const threadById=id=>board.threads.find(t=>t.id===id);
const threadColor=th=>TC[board.threads.indexOf(th)%TC.length];
const threadsOfTheme=id=>board.threads.filter(th=>th.themeIds.includes(id));
const words=(s,n)=>s.split(/\s+/).slice(0,n).join(" ");

/* ---------- Undo ---------- */
function content(){const b=clone(board);delete b.id;delete b.isExample;delete b.updatedAt;return b}
function snap(){hist.push(JSON.stringify(content()));if(hist.length>80)hist.shift();updUndo()}
function undo(){
  if(!hist.length)return;
  const prev=JSON.parse(hist.pop());
  board=Object.assign(prev,{id:board.id,isExample:board.isExample,updatedAt:board.updatedAt});
  if(ui.sel&&!threadById(ui.sel))ui.sel=null;
  if(ui.folder&&!themeById(ui.folder))ui.folder=null;
  if(ui.edit&&!itemById(ui.edit))ui.edit=null;
  ui.pop=null;touch(true);render();updUndo();
}
function updUndo(){const b=$("#undoBtn");if(b)b.disabled=!hist.length}

/* ---------- Persistence ---------- */
const LS="hb.boards.v1";
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function lsWrite(o){try{localStorage.setItem(LS,JSON.stringify(o));return true}catch(e){return false}}
function userCol(){return caps.db.collection("data/users/"+caps.uid)}
const usingDb=()=>!!(caps.db&&caps.uid);
async function listBoards(){
  if(usingDb()){
    const snap=await userCol().get();
    return snap.docs.filter(d=>d.exists&&d.id.startsWith("board-")).map(d=>{const v=d.data();return{id:v.board.id,title:v.board.title,updatedAt:v.board.updatedAt||0}});
  }
  return Object.values(lsRead()).map(b=>({id:b.id,title:b.title,updatedAt:b.updatedAt||0}));
}
async function loadBoard(id){
  if(usingDb()){const s=await userCol().doc("board-"+id).get();return s.exists?clone(s.data().board):null}
  const all=lsRead();return all[id]?clone(all[id]):null;
}
async function persist(b){
  if(usingDb()){await userCol().doc("board-"+b.id).set({board:clone(b)});return"db"}
  const all=lsRead();all[b.id]=clone(b);return lsWrite(all)?"local":"none";
}
async function removeBoard(id){
  if(usingDb()){await userCol().doc("board-"+id).delete();return}
  const all=lsRead();delete all[id];lsWrite(all);
}
let saveTimer=null,saving=false,pending=false;
function setStatus(t,warn){const s=$("#status");s.textContent=t;s.classList.toggle("warn",!!warn)}
function touch(picker){
  if(board.isExample){board.isExample=false;board.id=uid("b_");board.title=board.title.replace(" (example)"," (my copy)");picker=true}
  board.updatedAt=Date.now();
  setStatus("Unsaved changes");
  clearTimeout(saveTimer);saveTimer=setTimeout(doSave,900);
  if(picker)upsertPicker();
}
async function doSave(){
  if(saving){pending=true;return}
  saving=true;setStatus("Saving…");
  try{
    const w=await persist(board);upsertPicker();
    if(w==="db")setStatus("Saved");else if(w==="local")setStatus("Saved in this browser only",true);else setStatus("Not saved: export your data to keep it",true);
  }catch(e){setStatus(e&&e.code==="quota_exceeded"?"Storage full: export and delete old boards":"Couldn't save. Export your data to keep it",true)}
  finally{saving=false;if(pending){pending=false;doSave()}}
}
function upsertPicker(){
  if(!board.isExample){
    const i=boards.findIndex(b=>b.id===board.id);const rec={id:board.id,title:board.title,updatedAt:board.updatedAt};
    if(i>=0)boards[i]=rec;else boards.push(rec);
  }
  renderPicker();
}
function renderPicker(){
  const list=boards.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  $("#boardSel").innerHTML=list.map(b=>`<option value="${esc(b.id)}"${b.id===board.id?" selected":""}>${esc(b.title||"Untitled blueprint")}</option>`).join("")+
    `<option value="example"${board.isExample?" selected":""}>Northline Buses (example)</option>`;
}

/* ---------- Board operations ---------- */
function detach(itemId){board.themes.forEach(t=>t.itemIds=t.itemIds.filter(x=>x!==itemId))}
function removeTheme(id){board.themes=board.themes.filter(t=>t.id!==id);board.threads.forEach(th=>th.themeIds=th.themeIds.filter(x=>x!==id));board.threads=board.threads.filter(th=>th.themeIds.length>=2)}
function prune(){board.themes.filter(t=>!t.itemIds.length).map(t=>t.id).forEach(removeTheme)}
function newTheme(col,row,ids,name){const t={id:uid("t_"),col,row,name:name||"New theme",summary:"",itemIds:ids};board.themes.push(t);return t}
function ensureTheme(spec){
  const [k,id]=spec.split(":");
  if(k==="theme")return themeById(id);
  const it=itemById(id);if(!it)return null;
  const ex=themeOfItem(id);if(ex)return ex;
  return newTheme(it.col,it.row,[id],words(it.text,5));
}
function moveItemTo(it,col,row){it.col=col;it.row=row}

function dropItem(itemId,tgt){
  const it=itemById(itemId);if(!it||!tgt)return;
  let [k,v]=tgt.split(/:(.*)/s);
  const cur=themeOfItem(itemId);
  if(ui.mode==="collect"&&k!=="cell"){
    const o=k==="item"?itemById(v):themeById(v);if(!o)return;k="cell";v=o.col+"|"+o.row;
  }
  if(k==="cell"){
    const [c,r]=v.split("|");
    if(it.col===c&&it.row===r&&!cur)return;
    snap();
    detach(itemId);
    moveItemTo(it,c,r);prune();touch();render();return;
  }
  if(k==="theme"){
    const th=themeById(v);if(!th||th===cur)return;
    snap();detach(itemId);moveItemTo(it,th.col,th.row);th.itemIds.push(itemId);prune();touch();render();
    toast(`Added to “${th.name}”`);return;
  }
  if(k==="item"){
    const other=itemById(v);if(!other||other.id===itemId)return;
    const ot=themeOfItem(other.id);
    if(ot){if(ot===cur)return;dropItem(itemId,"theme:"+ot.id);return}
    snap();detach(itemId);moveItemTo(it,other.col,other.row);
    const t=newTheme(other.col,other.row,[other.id,itemId],"");
    prune();touch();ui.folder=t.id;ui.naming=true;render();
  }
}
function dropTheme(themeId,tgt){
  const th=themeById(themeId);if(!th||!tgt)return;
  let [k,v]=tgt.split(/:(.*)/s);
  if(ui.mode==="collect"&&k!=="cell"){const o=k==="item"?itemById(v):themeById(v);if(!o)return;k="cell";v=o.col+"|"+o.row}
  if(k==="cell"){
    const [c,r]=v.split("|");if(th.col===c&&th.row===r)return;
    snap();th.col=c;th.row=r;th.itemIds.forEach(id=>moveItemTo(itemById(id),c,r));touch();render();return;
  }
  if(k==="theme"){
    const o=themeById(v);if(!o||o===th)return;
    snap();
    th.itemIds.forEach(id=>{const i=itemById(id);moveItemTo(i,o.col,o.row);o.itemIds.push(id)});
    board.threads.forEach(t=>{t.themeIds=t.themeIds.map(x=>x===th.id?o.id:x).filter((x,i,a)=>a.indexOf(x)===i)});
    th.itemIds=[];removeTheme(th.id);touch();render();toast(`Merged into “${o.name}”`);return;
  }
  if(k==="item"){
    const it=itemById(v);if(!it)return;const ot=themeOfItem(it.id);
    if(ot){dropTheme(themeId,"theme:"+ot.id);return}
    snap();th.col=it.col;th.row=it.row;th.itemIds.forEach(id=>moveItemTo(itemById(id),it.col,it.row));th.itemIds.push(it.id);touch();render();
  }
}
function dropLink(from,tgt,x,y){
  if(!tgt)return;
  const [fk,fid]=from.split(":"),[tk,tid]=tgt.split(":");
  if(tk!=="theme"&&tk!=="item")return;
  if(fk===tk&&fid===tid)return;
  const fromTheme=fk==="theme"?themeById(fid):themeOfItem(fid);
  const toTheme=tk==="theme"?themeById(tid):themeOfItem(tid);
  if(fromTheme&&toTheme&&fromTheme===toTheme)return;
  let th=null;
  if(fromTheme){
    const sel=ui.sel&&threadById(ui.sel);
    if(sel&&sel.themeIds[sel.themeIds.length-1]===fromTheme.id)th=sel;
    else{const ends=board.threads.filter(t=>t.themeIds[t.themeIds.length-1]===fromTheme.id);if(ends.length===1)th=ends[0]}
  }
  if(th&&toTheme&&th.themeIds.includes(toTheme.id)){toast(`“${toTheme.name}” is already in “${th.name||"this thread"}”`);return}
  snap();
  const A=ensureTheme(from),B=ensureTheme(tgt);if(!A||!B)return;
  if(th){
    th.themeIds.push(B.id);ui.sel=th.id;touch();render();toast(`Extended “${th.name}”`);return;
  }
  th={id:uid("th_"),name:"",themeIds:[A.id,B.id],rationale:"",narrative:""};
  board.threads.push(th);ui.sel=th.id;ui.pop={id:th.id,x,y};touch();render();
}

/* ---------- Claude ---------- */
const inClaude=!!(window.claude&&typeof window.claude.use==="function");
const KEYLS="hb.anthropicKey.v1";
const MODEL="claude-sonnet-5-5";
function getKey(){try{return localStorage.getItem(KEYLS)||""}catch(e){return""}}
function setKey(k){try{if(k)localStorage.setItem(KEYLS,k);else localStorage.removeItem(KEYLS);return true}catch(e){return false}}
async function apiSample(prompt){
  const key=getKey();
  if(!key)throw{message:"Add your Anthropic API key in Board settings to use Claude features."};
  let res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:MODEL,max_tokens:4096,messages:[{role:"user",content:prompt}]})});
  }catch(e){throw{message:"Couldn't reach Anthropic. Check your connection and try again."}}
  let body=null;try{body=await res.json()}catch(e){}
  if(!res.ok){
    const msg=(body&&body.error&&body.error.message)||"";
    if(res.status===401||res.status===403)throw{message:"Anthropic didn't accept that API key. Check it in Board settings."};
    if(res.status===429)throw{code:"rate_limited",message:"Your API key has hit its rate limit. Wait a minute and try again."};
    if(res.status===529||res.status>=500)throw{message:"Claude is overloaded right now. Try again in a minute."};
    if(/credit|billing|balance/i.test(msg))throw{message:"Your Anthropic account is out of credit. Add credit in the Anthropic Console."};
    throw{message:"Claude couldn't complete that request"+(msg?": "+msg:".")};
  }
  const text=((body&&body.content)||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
  return{text,truncated:body&&body.stop_reason==="max_tokens"};
}
function parseLoose(t){
  if(typeof t!=="string")return t;
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<a)throw{message:"Claude's reply wasn't in the expected format. Try again."};
  return JSON.parse(t.slice(a,b+1));
}
async function askJSON(prompt){
  const s=caps.sample;if(!s)throw{message:"Claude isn't available on this page."};
  let r;
  try{r=await s(prompt,{modelTier:"default",cache:false})}
  catch(e){
    if(e&&e.code==="not_granted"){caps.sample=null;render()}
    if(e&&e.code==="rate_limited")throw{message:"Claude is busy right now. Wait a minute and try again."};
    throw e;
  }
  return parseLoose(r.text);
}
function boardContext(){
  return `Board: ${board.title}\nPurpose: ${board.purpose||"(not stated)"}\nColumns (horizons): ${COLS.map(c=>`${c} = ${hz(c).label}${hz(c).period?" ("+hz(c).period+")":""}`).join("; ")}\nRows (business stack layers): ${ROWS.map(r=>`${r} = ${ly(r).label}`).join("; ")}`;
}
const itemLine=i=>`${i.id} | ${i.col}|${i.row} | ${i.kind==="source"?"SOURCE (fact)":"TOPIC (idea)"} | ${i.text}${i.detail?" — "+i.detail:""}${i.ref?" [ref: "+i.ref+"]":""}`;
const themeLine=t=>`${t.id} | ${t.col}|${t.row} | ${t.name||"(unnamed)"}${t.summary?" — "+t.summary:""} | inputs: ${t.itemIds.map(id=>{const i=itemById(id);return i?(i.kind==="source"?"[fact] ":"[idea] ")+i.text:""}).join("; ")}`;

async function autoCluster(){
  const loose=board.items.filter(i=>!themeOfItem(i.id));
  if(!loose.length){toast("Every card is already in a stack.");return}
  ui.busy="cluster";render();
  const prompt=`You are helping facilitate a Horizon Blueprint workshop. Cards sit in a 3x3 board: columns are planning horizons, rows are layers of the business stack. Each card is a TOPIC (an idea, opportunity or question) or a SOURCE (a fact or observation). Participants group cards in the same cell into named stacks (themes).

${boardContext()}

Existing stacks (id | cell | name — summary | cards):
${board.themes.map(themeLine).join("\n")||"(none)"}

Cards not yet in a stack (id | cell | kind | text):
${loose.map(itemLine).join("\n")}

Task: place every unstacked card. Put a card into an existing stack in the SAME cell when it clearly belongs there; otherwise group it with other unstacked cards from the same cell into a new stack. A card that stands alone may become a one-card stack. Never mix cells. Do not change existing stacks other than adding cards.
Name new stacks in 2 to 5 plain words; give each a one-sentence summary in plain UK English. Do not invent facts.

Return JSON only:
{"assign":[{"itemId":"i9","themeId":"t3"}],"newStacks":[{"cell":"H1|customer","name":"...","summary":"...","itemIds":["i1","i2"]}]}`;
  try{
    const out=await askJSON(prompt);
    const looseIds=new Set(loose.map(i=>i.id));const used=new Set();
    const ops=[];
    for(const a of (out.assign||[])){const it=itemById(a.itemId),th=themeById(a.themeId);if(it&&th&&looseIds.has(it.id)&&!used.has(it.id)&&th.col===it.col&&th.row===it.row){used.add(it.id);ops.push(()=>th.itemIds.push(it.id))}}
    const fresh=[];
    for(const n of (out.newStacks||[])){
      const [c,r]=String(n.cell||"").split("|");if(!COLS.includes(c)||!ROWS.includes(r))continue;
      const ids=(n.itemIds||[]).filter(id=>looseIds.has(id)&&!used.has(id)&&itemById(id).col===c&&itemById(id).row===r);
      if(!ids.length)continue;ids.forEach(id=>used.add(id));
      fresh.push({col:c,row:r,name:String(n.name||"Theme").slice(0,80),summary:String(n.summary||"").slice(0,280),ids});
    }
    if(!used.size)throw{message:"Claude didn't return a usable grouping. Try again."};
    snap();ops.forEach(f=>f());fresh.forEach(f=>{const t=newTheme(f.col,f.row,f.ids,f.name);t.summary=f.summary});
    touch();ui.busy=null;render();
    toast(`Claude placed ${used.size} card${used.size>1?"s":""} into stacks`,true);return;
  }catch(e){toast(e.message||"Something went wrong asking Claude.")}
  ui.busy=null;render();
}

/* ---------- Structural analysis ---------- */
function evidence(themeIds){
  let s=0,t=0;
  themeIds.forEach(id=>{const x=themeById(id);if(!x)return;x.itemIds.forEach(i=>{const it=itemById(i);if(!it)return;it.kind==="source"?s++:t++})});
  return{s,t};
}
function gaps(){
  const out=[];
  const loose=board.items.filter(i=>!themeOfItem(i.id));
  if(loose.length)out.push(["w",`${loose.length} card${loose.length>1?"s are":" is"} not in any stack: ${loose.slice(0,3).map(i=>"“"+i.text+"”").join(", ")}${loose.length>3?"…":""}`]);
  const empty=[];COLS.forEach(c=>ROWS.forEach(r=>{if(!board.items.some(i=>i.col===c&&i.row===r))empty.push(cellName(c,r))}));
  if(empty.length)out.push(["w",`No cards yet in ${empty.join("; ")}.`]);
  const orphan=board.themes.filter(t=>!threadsOfTheme(t.id).length);
  if(orphan.length)out.push(["i",`${orphan.length} theme${orphan.length>1?"s sit":" sits"} outside every thread: ${orphan.map(t=>t.name||"(unnamed)").join(", ")}.`]);
  board.threads.forEach(th=>{
    const nm=th.name||"Unnamed thread";
    const cols=new Set(th.themeIds.map(id=>(themeById(id)||{}).col).filter(Boolean));
    if(cols.size<2)out.push(["i",`“${nm}” stays within one horizon, so it doesn't yet show a route to the future.`]);
    if(!th.themeIds.some(id=>(themeById(id)||{}).col==="H1"))out.push(["i",`“${nm}” has no H1 theme, so nothing in the current cycle moves it forward.`]);
    const e=evidence(th.themeIds);if(e.s===0&&e.t>0)out.push(["w",`“${nm}” rests on ideas only, with no sources behind it.`]);
  });
  const h3=board.items.filter(i=>i.col==="H3");
  if(h3.length&&!h3.some(i=>i.kind==="source"))out.push(["i","H3 has no sources. Trends or comparable cases would make the long view easier to defend."]);
  if(!out.length&&board.items.length)out.push(["ok","No structural gaps: every card is stacked, every theme is threaded and every cell has content."]);
  return out;
}
function draftFromStructure(){
  snap();
  const n=board.items.length,s=board.items.filter(i=>i.kind==="source").length;
  const counts={};board.themes.forEach(t=>{counts[t.col+"|"+t.row]=(counts[t.col+"|"+t.row]||0)+t.itemIds.length});
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const longest=board.threads.slice().sort((a,b)=>b.themeIds.length-a.themeIds.length)[0];
  let o=`${board.title} brings together ${n} card${n===1?"":"s"} (${s} source${s===1?"":"s"} and ${n-s} topic${n-s===1?"":"s"}), grouped into ${board.themes.length} theme${board.themes.length===1?"":"s"} and connected by ${board.threads.length} thread${board.threads.length===1?"":"s"}.`;
  if(top){const [c,r]=top[0].split("|");o+=` Most material sits in ${cellName(c,r)}.`}
  if(longest)o+=`\n\nThe longest thread, “${longest.name||"Unnamed thread"}”, runs through ${longest.themeIds.length} themes.`;
  board.narrative.overview=o;
  board.threads.forEach(th=>{
    const ts=th.themeIds.map(themeById).filter(Boolean);if(!ts.length)return;
    const first=ts[0],last=ts[ts.length-1],mid=ts.slice(1,-1);const e=evidence(th.themeIds);
    th.narrative=`Starts with “${first.name}” in ${cellName(first.col,first.row)}${mid.length?", moves through "+mid.map(t=>"“"+t.name+"”").join(", "):""} and arrives at “${last.name}” in ${cellName(last.col,last.row)}. ${th.rationale?th.rationale+" ":""}It draws on ${e.s} source${e.s===1?"":"s"} and ${e.t} topic${e.t===1?"":"s"}.`;
  });
  board.narrative.insights=gaps().filter(g=>g[0]!=="ok").map(g=>g[1]).slice(0,5);
  board.narrative.generated="draft";
  touch();render();
}

      const a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y;
      if(Math.abs(dx)>40)d+=` C${(a.x+dx*.5).toFixed(1)},${a.y.toFixed(1)} ${(b.x-dx*.5).toFixed(1)},${b.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
      else{const bow=46;d+=` C${(a.x+bow).toFixed(1)},${(a.y+dy*.3).toFixed(1)} ${(b.x+bow).toFixed(1)},${(b.y-dy*.3).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`}
    }
    const on=ui.sel===th.id,op=ui.sel?(on?1:.1):.85;
    out+=`<path d="${d}" style="stroke:${TC[ti%TC.length]};opacity:${op}" fill="none" stroke-width="${on?4.5:3}" stroke-linecap="round"/>`;
    out+=`<path class="hit" d="${d}" stroke="transparent" stroke-width="16" fill="none" data-act="selThread" data-id="${th.id}"/>`;
  });
  svg.innerHTML=out;
}

/* ---------- Drag and drop ---------- */
let drag=null,suppressClick=false;
document.addEventListener("pointerdown",e=>{
  if(e.button>0||ui.mode==="story")return;
  const el=e.target.closest("[data-drag]");if(!el)return;
  if(e.target.closest("input,textarea,button:not(.tile)"))return;
  drag={spec:el.dataset.drag,el,sx:e.clientX,sy:e.clientY,started:false,tgt:null,tEl:null,inFolder:!!el.closest(".folder")};
});
window.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
    startDrag(e);
  }
  e.preventDefault();
  if(drag.link){
    drag.line.setAttribute("x2",e.clientX);drag.line.setAttribute("y2",e.clientY);
  }else{
    drag.ghost.style.left=(e.clientX-drag.ox)+"px";drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  }
  const hit=document.elementFromPoint(e.clientX,e.clientY);
  let t=hit&&hit.closest("[data-drop]");
  if(t&&!validTarget(t.dataset.drop))t=drag.link?null:(t.closest(".mc")||null);
  if(t&&!validTarget(t.dataset.drop))t=null;
  if(t!==drag.tEl){if(drag.tEl)drag.tEl.classList.remove("drop-on");drag.tEl=t;if(t)t.classList.add("drop-on")}
},{passive:false});
function validTarget(spec){
  if(!spec)return false;
  const [k,v]=spec.split(/:(.*)/s);
  if(drag.link){
    if(k==="cell")return false;
    const own=drag.spec.slice(5);if(own===spec)return false;
    const a=own.startsWith("theme:")?themeById(own.slice(6)):themeOfItem(own.slice(5));
    const b=k==="theme"?themeById(v):themeOfItem(v);
    return !(a&&b&&a===b);
  }
  if(spec===drag.spec)return false;
  if(drag.spec.startsWith("item:")&&k==="theme"){const th=themeById(v);if(th&&th.itemIds.includes(drag.spec.slice(5)))return false}
  if(drag.spec.startsWith("theme:")&&k==="item"){const th=themeById(drag.spec.slice(6));if(th&&th.itemIds.includes(v))return false}
  return true;
}
function startDrag(e){
  drag.started=true;document.body.classList.add("dragging");
  if(drag.spec.startsWith("link:")){
    drag.link=true;
    const r=drag.el.getBoundingClientRect();
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","live");
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",r.left+r.width/2);ln.setAttribute("y1",r.top+r.height/2);ln.setAttribute("x2",e.clientX);ln.setAttribute("y2",e.clientY);
    ln.setAttribute("stroke-width","3");ln.setAttribute("stroke-linecap","round");ln.setAttribute("stroke-dasharray","6 6");ln.style.stroke="var(--hl)";
    svg.appendChild(ln);document.body.appendChild(svg);drag.svg=svg;drag.line=ln;
    return;
  }
  const r=drag.el.getBoundingClientRect();
  const g=drag.el.cloneNode(true);g.classList.add("dragghost");g.classList.remove("drop-on");
  g.querySelectorAll(".handle").forEach(n=>n.remove());
  g.style.width=r.width+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";
  document.body.appendChild(g);drag.ghost=g;drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;
  drag.el.classList.add("lifting");
  if(drag.inFolder){ui.folder=null;renderLayer();render()}
}
function endDrag(e,cancel){
  if(!drag)return;
  const d=drag;drag=null;
  if(!d.started)return;
  document.body.classList.remove("dragging");
  suppressClick=true;setTimeout(()=>suppressClick=false,0);
  if(d.ghost)d.ghost.remove();if(d.svg)d.svg.remove();
  if(d.tEl)d.tEl.classList.remove("drop-on");
  if(d.el)d.el.classList.remove("lifting");
  const tgt=cancel||!d.tEl?null:d.tEl.dataset.drop;
  if(!tgt)return;
  if(d.link)dropLink(d.spec.slice(5),tgt,e.clientX,e.clientY);
  else if(d.spec.startsWith("item:"))dropItem(d.spec.slice(5),tgt);
  else if(d.spec.startsWith("theme:"))dropTheme(d.spec.slice(6),tgt);
}
window.addEventListener("pointerup",e=>endDrag(e,false));
window.addEventListener("pointercancel",e=>endDrag(e,true));

/* ---------- Export / import ---------- */
function toMarkdown(){
  const L=[];
  L.push(`# ${board.title}`,"");
  if(board.purpose)L.push(`> ${board.purpose}`,"");
  L.push(COLS.map(c=>`**${c}** ${hz(c).label}${hz(c).period?" ("+hz(c).period+")":""}`).join(" · "),"");
  L.push("## Overview","",board.narrative.overview||"_Not written yet._","");
  if(board.threads.length){L.push("## Threads","");board.threads.forEach((th,ix)=>{
    const e=evidence(th.themeIds);
    L.push(`### ${ix+1}. ${th.name||"Unnamed thread"}`,"",th.themeIds.map(id=>{const t=themeById(id);return t?`${t.name} (${t.col}, ${ly(t.row).label})`:""}).filter(Boolean).join(" → "),"");
    if(th.narrative)L.push(th.narrative,"");
    L.push(`_Evidence: ${e.s} sources, ${e.t} topics._`,"");
  })}
  if(board.narrative.insights.length){L.push("## Insights","");board.narrative.insights.forEach(t=>L.push(`- ${t}`));L.push("")}
  const g=gaps();if(g.length){L.push("## Gaps and signals","");g.forEach(x=>L.push(`- ${x[1]}`));L.push("")}
  L.push("## Board","");
  ROWS.forEach(r=>COLS.forEach(c=>{
    const ths=board.themes.filter(t=>t.col===c&&t.row===r);const loose=board.items.filter(i=>i.col===c&&i.row===r&&!themeOfItem(i.id));
    if(!ths.length&&!loose.length)return;
    L.push(`### ${c} · ${ly(r).label}`,"");
    ths.forEach(t=>{L.push(`**${t.name}**${t.summary?" — "+t.summary:""}`);t.itemIds.forEach(id=>{const i=itemById(id);if(i)L.push(`- ${i.kind==="source"?"[source] ":""}${i.text}${i.ref?" ("+i.ref+")":""}`)});L.push("")});
    if(loose.length){L.push("_Not in a theme:_");loose.forEach(i=>L.push(`- ${i.text}`));L.push("")}
  }));
  return L.join("\n");
}

function slug(){return (board.title||"blueprint").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"blueprint"}

let editSnapped=null;
document.addEventListener("focusin",e=>{const el=e.target;if((el.dataset&&(el.dataset.bind||el.dataset.edit))&&editSnapped!==el){snap();editSnapped=el}});
document.addEventListener("focusout",e=>{if(e.target===editSnapped){editSnapped=null;if((e.target.dataset.bind||"").startsWith("thread.")&&!ui.pop)setTimeout(()=>{if(!document.activeElement||!document.activeElement.closest(".tedit"))render()},0)}});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.cbind&&ui.compose){ui.compose[el.dataset.cbind]=el.value;return}
  if(el.dataset.bind){
    const p=el.dataset.bind.split(".");const v=el.value;
    if(p[0]==="title"){board.title=v;touch(true);return}
    if(p[0]==="purpose")board.purpose=v;
    else if(p[0]==="h")board.horizons[p[1]][p[2]]=v;
    else if(p[0]==="l")board.layers[p[1]][p[2]]=v;
    else if(p[0]==="theme"){const t=themeById(p[1]);if(t)t[p[2]]=v}
    else if(p[0]==="thread"){const t=threadById(p[1]);if(t)t[p[2]]=v}
    else if(p[0]==="item"){const t=itemById(p[1]);if(t)t[p[2]]=v}
    touch();return;
  }
  if(el.dataset.edit){
    const p=el.dataset.edit.split(".");const v=el.innerText.replace(/\n{3,}/g,"\n\n").trim();
    if(p[0]==="overview")board.narrative.overview=v;
    else if(p[0]==="thn"){const t=threadById(p[1]);if(t)t.narrative=v}
    else if(p[0]==="ins")board.narrative.insights[+p[1]]=v;
    touch();
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="importFile"){const f=el.files&&el.files[0];if(!f)return;f.text().then(importText);el.value="";return}
  if(el.id==="boardSel")switchBoard(el.value);
});
document.addEventListener("keydown",e=>{
  const t=e.target;const typing=t.matches&&t.matches("input,textarea,[contenteditable]");
  if(e.key==="Enter"&&t.id==="cmp-text"){e.preventDefault();A.cadd();return}
  if(e.key==="Enter"&&(t.id==="fname"||t.id==="fsum"||t.id==="ed-text"||t.id==="ed-ref")){e.preventDefault();closeLayer();return}
  if(e.key==="Enter"&&t.id==="popName"){e.preventDefault();closePop();return}
  if(e.key==="Enter"&&t.id==="apiKeyIn"){e.preventDefault();A.saveKey();return}
  if(e.key==="Escape"){
    if(drag){endDrag(e,true);return}
    if(ui.pop){closePop();return}
    if(ui.folder||ui.edit||ui.settings||ui.dialog){closeLayer();return}
    if(ui.compose){ui.compose=null;render();return}
    if(ui.sel){ui.sel=null;render();return}
  }
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&!typing){e.preventDefault();undo();return}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("tile")){e.preventDefault();t.click()}
});

async function switchBoard(id){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await doSave()}
  if(id==="example")board=exampleBoard();
  else{const b=await loadBoard(id).catch(()=>null);if(!b){toast("Couldn't open that board.");renderPicker();return}board=b}
  hist=[];ui.sel=null;ui.folder=null;ui.edit=null;ui.compose=null;ui.pop=null;
  setStatus(board.isExample?"":(usingDb()?"Saved":"Saved in this browser only"),!board.isExample&&!usingDb());
  renderPicker();render();
}
function route(){const h=location.hash.replace("#","");ui.mode=MODES.includes(h)?h:"collect";ui.pop=null;if(ui.mode!=="collect")ui.compose=null;render()}
window.addEventListener("hashchange",route);
if("ResizeObserver" in window)new ResizeObserver(()=>requestAnimationFrame(drawThreads)).observe(document.body);
else window.addEventListener("resize",drawThreads);

/* ---------- Boot ---------- */
renderPicker();route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawThreads());
const use=n=>(window.claude&&typeof window.claude.use==="function")?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
(async function init(){
  const [db,user,sample,downloads]=await Promise.all([use("db"),use("user"),use("sample"),use("downloads")]);
  caps.db=db;caps.user=user;caps.sample=sample||(!inClaude&&getKey()?apiSample:null);caps.downloads=downloads;
  if(db&&user){try{caps.uid=await user.id()}catch(e){caps.uid=null}}
  try{boards=await listBoards()}catch(e){caps.db=null;boards=await listBoards().catch(()=>[])}
  const latest=boards.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  if(latest&&board.isExample&&!hist.length){
    const b=await loadBoard(latest.id).catch(()=>null);
    if(b){board=b;setStatus(usingDb()?"Saved":"Saved in this browser only",!usingDb())}
  }
  renderPicker();render();
})();
})();
</script>
</body>
</html>
